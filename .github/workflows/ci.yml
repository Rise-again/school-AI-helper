name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-linux.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: 单元测试（不依赖数据库与模型）
        working-directory: backend
        env:
          APP_ENV: test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-pass
          JWT_SECRET: 0123456789abcdef0123456789abcdef
          LLM_BASE_URL: http://127.0.0.1:8001/v1
          EMBED_BASE_URL: http://127.0.0.1:8002
          RERANK_BASE_URL: http://127.0.0.1:8002
          OCR_BASE_URL: http://127.0.0.1:8002
        run: python -m pytest -q

  model_service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装轻量依赖（不装 torch / paddle）
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi==0.162.0" "uvicorn==0.54.0" "pydantic==2.14.3" \
                      "httpx==0.28.1" "python-multipart==0.0.32" pytest
      - name: 契约测试（用假后端）
        working-directory: model_service
        run: python -m pytest -q
