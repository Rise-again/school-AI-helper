### P4 QLoRA 训练配置（Llama-Factory 0.9.3）
### 依据见 docs/14-P4-微调方案与SFT样例.md 第 4 节

model_name_or_path: /hy-tmp/campus/models/qwen2.5-7b-instruct
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

quantization_bit: 4
quantization_method: bnb
double_quantization: true

dataset: campus_sft
eval_dataset: campus_sft_val
dataset_dir: /hy-tmp/campus/data/sft
template: qwen
cutoff_len: 3072
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2
packing: false

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
eval_accumulation_steps: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 0.3
optim: paged_adamw_8bit
bf16: true
gradient_checkpointing: true

logging_steps: 5
eval_strategy: steps
eval_steps: 50
save_strategy: steps
save_steps: 50
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

report_to: tensorboard
logging_dir: /hy-tmp/campus/data/sft/tb
output_dir: /hy-tmp/campus/data/sft/output
seed: 42
